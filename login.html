<!-- login.html (Fixed - No scroll on body) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LCWU</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet">
    <link rel="shortcut icon" href="./images/logo.png">
    <style>
        /* Import Google Font */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

        /* CSS Variables - Same as dashboard */
        :root {
            --color-primary: #7380ec;
            --color-danger: #ff7782;
            --color-success: #41f1b6;
            --color-warning: #ffbb55;
            --color-white: #fff;
            --color-info: #7d8da1;
            --color-dark: #363949;
            --color-light: rgba(132, 139, 200, 0.18);
            --color-dark-varient: #677483;
            --color-background: #f6f6f9;
            --card-border-radius: 2rem;
            --border-radius-1: 0.4rem;
            --border-radius-2: 1.2rem;
            --card-padding: 1.8rem;
            --box-shadow: 0 2rem 3rem var(--color-light);
        }

        /* Dark theme variables */
        .dark-theme {
            --color-background: #181a1e;
            --color-white: #202528;
            --color-dark: #edeffd;
            --color-dark-varient: #a3bdcc;
            --color-light: rgba(0,0,0,0.4);
            --box-shadow: 0 2rem 3rem rgba(0,0,0,0.4);
        }

        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--color-background);
            perspective: 1000px;
            overflow: hidden; /* NO SCROLL ON BODY */
            transition: background 0.3s ease;
        }

        /* Main container with 3D effect */
        .container {
            background: var(--color-white);
            padding: 2.5rem;
            border-radius: var(--card-border-radius);
            box-shadow: var(--box-shadow);
            width: 100%;
            max-width: 900px;
            transform-style: preserve-3d;
            transition: all 0.5s ease;
            animation: float 6s ease-in-out infinite;
            max-height: 90vh;
            overflow-y: auto; /* Scroll only inside container if needed */
            position: relative;
        }
        
        /* Hide scrollbar but keep functionality */
        .container::-webkit-scrollbar {
            width: 5px;
        }
        .container::-webkit-scrollbar-track {
            background: var(--color-light);
            border-radius: 10px;
        }
        .container::-webkit-scrollbar-thumb {
            background: var(--color-primary);
            border-radius: 10px;
        }
        
        .container:hover {
            box-shadow: 0 20px 60px rgba(115, 128, 236, 0.2);
            transform: rotateY(5deg) rotateX(3deg) scale(1.02);
        }

        /* Floating animation */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        /* Logo styles */
        .logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        
        .logo img {
            width: 60px;
            height: 60px;
            display: inline-block;
            animation: spinLogo 15s linear infinite;
        }
        
        @keyframes spinLogo {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }
        
        .logo h2 {
            font-size: 2rem;
            color: var(--color-dark);
            margin-top: 0.5rem;
        }
        
        .logo h2 span {
            color: var(--color-danger);
        }

        /* Theme toggle button - Same as dashboard */
        .theme-toggler-login {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--color-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 1.6rem;
            width: 4.2rem;
            cursor: pointer;
            border-radius: var(--border-radius-1);
            transition: all 0.3s ease;
        }
        .theme-toggler-login:hover {
            transform: scale(1.1);
        }
        .theme-toggler-login span {
            font-size: 1.2rem;
            width: 50%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            color: var(--color-dark);
        }
        .theme-toggler-login span.active {
            background-color: var(--color-primary);
            color: white;
            border-radius: var(--border-radius-1);
        }

        /* Toggle buttons for login/register */
        .toggle-btns {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            border-radius: var(--border-radius-1);
            background: var(--color-light);
            padding: 0.3rem;
        }
        
        .toggle-btns button {
            flex: 1;
            padding: 0.8rem;
            border: none;
            border-radius: var(--border-radius-1);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s ease;
            background: transparent;
            color: var(--color-dark);
        }
        
        .toggle-btns button.active {
            background: var(--color-primary);
            color: white;
            box-shadow: 0 4px 15px rgba(115, 128, 236, 0.4);
            transform: scale(1.05);
        }
        
        .toggle-btns button:hover {
            transform: scale(1.05);
        }

        /* Form styles */
        .form-group {
            margin-bottom: 1rem;
            opacity: 0;
            animation: slideUp 0.5s ease forwards;
        }
        
        .form-group:nth-child(1) { animation-delay: 0.05s; }
        .form-group:nth-child(2) { animation-delay: 0.1s; }
        .form-group:nth-child(3) { animation-delay: 0.15s; }
        .form-group:nth-child(4) { animation-delay: 0.2s; }
        .form-group:nth-child(5) { animation-delay: 0.25s; }
        .form-group:nth-child(6) { animation-delay: 0.3s; }
        .form-group:nth-child(7) { animation-delay: 0.35s; }
        .form-group:nth-child(8) { animation-delay: 0.4s; }
        .form-group:nth-child(9) { animation-delay: 0.45s; }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.2rem;
            font-weight: 500;
            color: var(--color-dark);
            font-size: 0.85rem;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border: 2px solid var(--color-light);
            border-radius: var(--border-radius-1);
            font-size: 0.9rem;
            transition: all 0.3s ease;
            background: var(--color-background);
            color: var(--color-dark);
        }
        
        .form-group input:focus, .form-group select:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 20px rgba(115, 128, 236, 0.2);
            transform: scale(1.02);
            outline: none;
        }
        
        .form-group input:hover, .form-group select:hover {
            transform: scale(1.02);
        }

        /* Profile picture upload - Image preview */
        .profile-upload {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .profile-upload .preview {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid var(--color-primary);
            overflow: hidden;
            flex-shrink: 0;
        }
        .profile-upload .preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-upload input[type="file"] {
            padding: 0.4rem;
            font-size: 0.8rem;
            border: 2px dashed var(--color-primary);
            background: var(--color-background);
            cursor: pointer;
            flex: 1;
        }
        .profile-upload input[type="file"]:hover {
            background: var(--color-light);
        }

        /* Horizontal layout for register form - 2 columns */
        .register-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem 1.5rem;
        }
        .register-grid .full-width {
            grid-column: 1 / -1;
        }

        /* Submit button */
        .submit-btn {
            width: 100%;
            padding: 0.9rem;
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: var(--border-radius-1);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }
        
        .submit-btn:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 10px 30px rgba(115, 128, 236, 0.4);
            background: #5a67d8;
        }
        
        .submit-btn:active {
            transform: scale(0.95);
        }

        /* Register link */
        .register-link {
            text-align: center;
            margin-top: 1rem;
            color: var(--color-info);
        }
        
        .register-link a {
            color: var(--color-primary);
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .register-link a:hover {
            color: #5a67d8;
            text-shadow: 0 0 20px rgba(115, 128, 236, 0.3);
        }

        /* Form visibility */
        .register-fields { display: none; }
        .register-fields.active { display: block; }
        .login-fields { display: block; }
        .login-fields.hidden { display: none; }

        /* Message styles */
        .message {
            padding: 0.8rem;
            border-radius: var(--border-radius-1);
            margin-bottom: 1rem;
            display: none;
            animation: shake 0.5s ease;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .message.error {
            background: #fee2e2;
            color: #dc2626;
            display: block;
        }
        
        .message.success {
            background: #d1fae5;
            color: #059669;
            display: block;
        }

        /* Password strength indicator */
        .password-strength {
            height: 4px;
            background: var(--color-light);
            border-radius: 2px;
            margin-top: 0.3rem;
            overflow: hidden;
        }
        .password-strength .bar {
            height: 100%;
            width: 0%;
            transition: all 0.5s ease;
            border-radius: 2px;
        }

        /* Responsive styles */
        @media (max-width: 768px) {
            .container {
                padding: 1.5rem;
                margin: 1rem;
                max-height: 95vh;
            }
            .register-grid {
                grid-template-columns: 1fr;
                gap: 0.5rem;
            }
            .profile-upload {
                flex-direction: column;
                align-items: stretch;
            }
            .profile-upload .preview {
                align-self: center;
            }
            .theme-toggler-login {
                top: 10px;
                right: 10px;
            }
            .logo h2 {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
                margin: 0.5rem;
                border-radius: var(--border-radius-2);
            }
            .toggle-btns button {
                font-size: 0.8rem;
                padding: 0.5rem;
            }
            .form-group input, .form-group select {
                font-size: 0.8rem;
                padding: 0.5rem;
            }
            .submit-btn {
                font-size: 0.9rem;
                padding: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <!-- Main Container -->
    <div class="container">
        <!-- Theme Toggler - Same as dashboard -->
        <div class="theme-toggler-login" id="loginThemeToggler">
            <span class="material-icons-sharp active">light_mode</span>
            <span class="material-icons-sharp">dark_mode</span>
        </div>

        <!-- Logo -->
        <div class="logo">
            <img src="./images/logo.png" alt="LCWU">
            <h2>L<span>C</span>WU</h2>
        </div>
        
        <!-- Toggle Buttons -->
        <div class="toggle-btns">
            <button class="active" onclick="switchForm('login')" id="loginTab">Login</button>
            <button onclick="switchForm('register')" id="registerTab">Register</button>
        </div>

        <!-- Message Display -->
        <div id="message" class="message"></div>

        <!-- ========== LOGIN FORM ========== -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="login-fields">
                <div class="form-group">
                    <label>Email or Roll Number</label>
                    <input type="text" id="loginId" placeholder="Enter email or roll number" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter password" required>
                </div>
                <button type="submit" class="submit-btn">Login</button>
            </div>
        </form>

        <!-- ========== REGISTER FORM ========== -->
        <form id="registerForm" onsubmit="handleRegister(event)" style="display:none;">
            <div class="register-fields active">
                <!-- 2 Column Grid Layout -->
                <div class="register-grid">
                    <!-- Profile Picture - Full Width -->
                    <div class="form-group full-width">
                        <label>Profile Picture</label>
                        <div class="profile-upload">
                            <div class="preview">
                                <img id="profilePreview" src="./images/profile-1.jpg" alt="Profile">
                            </div>
                            <input type="file" id="profilePic" accept="image/*" onchange="previewImage(event)">
                        </div>
                    </div>

                    <!-- Column 1 -->
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="regName" placeholder="Enter full name" required>
                    </div>
                    <div class="form-group">
                        <label>Roll Number</label>
                        <input type="text" id="regRoll" placeholder="Enter roll number" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="regEmail" placeholder="Enter email" required>
                    </div>
                    <div class="form-group">
                        <label>Course</label>
                        <input type="text" id="regCourse" placeholder="Enter course name" value="BTech. Computer Science & Engineering">
                    </div>

                    <!-- Column 2 -->
                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input type="date" id="regDob" value="2003-03-17">
                    </div>
                    <div class="form-group">
                        <label>Contact Number</label>
                        <input type="tel" id="regContact" placeholder="Enter phone number" value="03261213069">
                    </div>
                    <div class="form-group">
                        <label>Address</label>
                        <input type="text" id="regAddress" placeholder="Enter address" value="House No 504, Street No 40, Ganjh Mughal Pura, Lahore">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="regPassword" placeholder="Create password" required oninput="checkPasswordStrength(this.value)">
                        <div class="password-strength">
                            <div class="bar" id="strengthBar"></div>
                        </div>
                    </div>

                    <!-- Confirm Password - Full Width -->
                    <div class="form-group full-width">
                        <label>Confirm Password</label>
                        <input type="password" id="regConfirmPassword" placeholder="Confirm password" required>
                    </div>
                </div>
                <button type="submit" class="submit-btn">Create Account</button>
            </div>
        </form>

        <!-- Toggle Link -->
        <div class="register-link">
            <span id="toggleText">Don't have an account? <a onclick="switchForm('register')">Register here</a></span>
        </div>
    </div>

    <!-- Material Icons for theme toggle -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet">

    <script>
        // =============================================
        // THEME TOGGLE - Same as dashboard
        // =============================================
        const themeToggler = document.getElementById('loginThemeToggler');
        
        // Apply saved theme
        function applySavedTheme() {
            const isDarkMode = localStorage.getItem('dark-theme') === 'true';
            if (isDarkMode) {
                document.body.classList.add('dark-theme');
                themeToggler.querySelector('span:nth-child(1)').classList.add('active');
                themeToggler.querySelector('span:nth-child(2)').classList.remove('active');
            } else {
                document.body.classList.remove('dark-theme');
                themeToggler.querySelector('span:nth-child(1)').classList.remove('active');
                themeToggler.querySelector('span:nth-child(2)').classList.add('active');
            }
        }
        applySavedTheme();

        // Toggle theme on click
        themeToggler.onclick = function() {
            document.body.classList.toggle('dark-theme');
            themeToggler.querySelector('span:nth-child(1)').classList.toggle('active');
            themeToggler.querySelector('span:nth-child(2)').classList.toggle('active');
            localStorage.setItem('dark-theme', document.body.classList.contains('dark-theme'));
        }

        // =============================================
        // CHECK IF USER IS ALREADY LOGGED IN
        // =============================================
        if (localStorage.getItem('currentUser')) {
            window.location.href = 'index.html';
        }

        // =============================================
        // SWITCH BETWEEN LOGIN AND REGISTER
        // =============================================
        function switchForm(type) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');
            const toggleText = document.getElementById('toggleText');
            const message = document.getElementById('message');
            
            message.className = 'message';
            message.style.display = 'none';

            if (type === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                toggleText.innerHTML = `Don't have an account? <a onclick="switchForm('register')">Register here</a>`;
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
                toggleText.innerHTML = `Already have an account? <a onclick="switchForm('login')">Login here</a>`;
            }
        }

        // =============================================
        // PROFILE PICTURE PREVIEW
        // =============================================
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const output = document.getElementById('profilePreview');
                output.src = reader.result;
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        // =============================================
        // PASSWORD STRENGTH CHECK
        // =============================================
        function checkPasswordStrength(password) {
            const bar = document.getElementById('strengthBar');
            let strength = 0;
            if (password.length >= 8) strength += 25;
            if (password.match(/[a-z]/)) strength += 25;
            if (password.match(/[A-Z]/)) strength += 25;
            if (password.match(/[0-9]/)) strength += 25;
            
            bar.style.width = strength + '%';
            if (strength <= 25) {
                bar.style.background = '#dc2626';
            } else if (strength <= 50) {
                bar.style.background = '#f59e0b';
            } else if (strength <= 75) {
                bar.style.background = '#3b82f6';
            } else {
                bar.style.background = '#10b981';
            }
        }

        // =============================================
        // SHOW MESSAGE
        // =============================================
        function showMessage(text, type) {
            const message = document.getElementById('message');
            message.textContent = text;
            message.className = 'message ' + type;
            message.style.display = 'block';
            setTimeout(() => {
                message.style.display = 'none';
            }, 5000);
        }

        // =============================================
        // HANDLE LOGIN
        // =============================================
        function handleLogin(e) {
            e.preventDefault();
            const id = document.getElementById('loginId').value;
            const password = document.getElementById('loginPassword').value;
            
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            
            const user = users.find(u => 
                (u.email === id || u.rollNumber === id) && u.password === password
            );
            
            if (user) {
                showMessage('Login successful! Redirecting...', 'success');
                localStorage.setItem('currentUser', JSON.stringify(user));
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            } else {
                showMessage('Invalid email/roll number or password', 'error');
            }
        }

        // =============================================
        // HANDLE REGISTER - Saves all user data
        // =============================================
        function handleRegister(e) {
            e.preventDefault();
            
            // Get all form values
            const name = document.getElementById('regName').value;
            const roll = document.getElementById('regRoll').value;
            const email = document.getElementById('regEmail').value;
            const course = document.getElementById('regCourse').value;
            const dob = document.getElementById('regDob').value;
            const contact = document.getElementById('regContact').value;
            const address = document.getElementById('regAddress').value;
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirmPassword').value;
            
            // Get profile picture (store as base64 or use default)
            const profilePic = document.getElementById('profilePreview').src;
            
            // Validations
            if (password !== confirm) {
                showMessage('Passwords do not match!', 'error');
                return;
            }
            
            if (password.length < 6) {
                showMessage('Password must be at least 6 characters', 'error');
                return;
            }
            
            // Get existing users
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            
            // Check if user already exists
            if (users.find(u => u.email === email || u.rollNumber === roll)) {
                showMessage('User already exists with this email or roll number', 'error');
                return;
            }
            
            // Save complete user data
            const newUser = {
                name: name,
                rollNumber: roll,
                email: email,
                course: course,
                dob: dob,
                contact: contact,
                address: address,
                profilePic: profilePic,
                password: password
            };
            
            users.push(newUser);
            localStorage.setItem('users', JSON.stringify(users));
            
            showMessage('Registration successful! Please login.', 'success');
            
            // Clear form
            document.getElementById('regName').value = '';
            document.getElementById('regRoll').value = '';
            document.getElementById('regEmail').value = '';
            document.getElementById('regCourse').value = 'BTech. Computer Science & Engineering';
            document.getElementById('regDob').value = '2003-03-17';
            document.getElementById('regContact').value = '03261213069';
            document.getElementById('regAddress').value = 'House No 504, Street No 40, Ganjh Mughal Pura, Lahore';
            document.getElementById('regPassword').value = '';
            document.getElementById('regConfirmPassword').value = '';
            document.getElementById('strengthBar').style.width = '0%';
            document.getElementById('profilePreview').src = './images/profile-1.jpg';
            
            setTimeout(() => switchForm('login'), 1500);
        }

        // =============================================
        // DEFAULT USERS FOR TESTING
        // =============================================
        if (!localStorage.getItem('users')) {
            const defaultUsers = [
                {
                    name: 'Nida',
                    rollNumber: '12102030',
                    email: 'nida@lcwu.edu.pk',
                    course: 'BTech. Computer Science & Engineering',
                    dob: '2003-03-17',
                    contact: '03261213069',
                    address: 'House No 504, Street No 40, Ganjh Mughal Pura, Lahore',
                    profilePic: './images/profile-1.jpg',
                    password: 'nida123'
                },
                {
                    name: 'Alex',
                    rollNumber: '12102031',
                    email: 'alex@lcwu.edu.pk',
                    course: 'BTech. Computer Science & Engineering',
                    dob: '2000-01-01',
                    contact: '1234567890',
                    address: 'Ghost town Road, New York, America',
                    profilePic: './images/profile-1.jpg',
                    password: 'alex123'
                }
            ];
            localStorage.setItem('users', JSON.stringify(defaultUsers));
        }
    </script>
</body>
</html>
