<!-- password.html (Fixed - Dark theme + Logout working) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet">
    <link rel="shortcut icon" href="./images/logo.png">
    <link rel="stylesheet" href="style.css">

    <style>
        /* Password change page styles */
        header{position: relative;}
        .change-password-container{
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 90vh;
            animation: fadeIn 0.8s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .change-password-container form{
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-radius: var(--border-radius-2);
            padding : 3.5rem;
            background-color: var(--color-white);
            box-shadow: var(--box-shadow);
            width: 95%;
            max-width: 32rem;
            transform-style: preserve-3d;
            transition: all 0.5s ease;
        }
        .change-password-container form:hover{
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            transform: rotateY(5deg) rotateX(3deg);
        }
        .change-password-container form input[type=password]{
            border: none;
            outline: none;
            border: 2px solid var(--color-light);
            background: transparent;
            height: 2.5rem;
            width: 100%;
            padding: 0 .8rem;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
            color: var(--color-dark);
        }
        .change-password-container form input[type=password]:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 20px rgba(115, 128, 236, 0.2);
            transform: scale(1.02);
        }
        .change-password-container form .box{
            padding: .5rem 0;
        }
        .change-password-container form .box p{
            line-height: 2;
        }
        .change-password-container form h2+p{margin: .4rem 0 1.2rem 0;} 
        .btn{
            background: none;
            border: none;
            border: 2px solid var(--color-primary) !important;
            border-radius: var(--border-radius-1);
            padding: .5rem 1rem;
            color: var(--color-white);
            background-color: var(--color-primary);
            cursor: pointer;
            margin: 1rem 1.5rem 1rem 0;
            margin-top: 1.5rem;
            transition: all 0.3s ease;
        }
        .btn:hover{
            color: var(--color-primary);
            background-color: transparent;
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(115, 128, 236, 0.3);
        }
        .btn:active {
            transform: scale(0.95);
        }
        .message {
            padding: 0.8rem;
            border-radius: 0.8rem;
            margin-bottom: 1rem;
            display: none;
            animation: slideDown 0.5s ease;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.error {
            background: #fee2e2;
            color: #dc2626;
            display: block;
        }
        .message.success {
            background: #d1fae5;
            color: #059669;
            display: block;
        }
        .password-strength {
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            margin-top: 0.5rem;
            overflow: hidden;
        }
        .password-strength .bar {
            height: 100%;
            width: 0%;
            transition: all 0.5s ease;
            border-radius: 2px;
        }
        /* Responsive */
        @media (max-width: 480px) {
            .change-password-container form {
                padding: 1.5rem;
                margin: 1rem;
            }
        }
    </style>

</head>
<body>
    <header>
        <div class="logo">
            <img src="./images/logo.png" alt="">
            <h2>L<span class="danger">C</span>WU</h2>
        </div>
        <div class="navbar">
            <a href="index.html">
                <span class="material-icons-sharp">home</span>
                <h3>Home</h3>
            </a>
            <a href="timetable.html" onclick="timeTableAll()">
                <span class="material-icons-sharp">today</span>
                <h3>Time Table</h3>
            </a> 
            <a href="exam.html">
                <span class="material-icons-sharp">grid_view</span>
                <h3>Examination</h3>
            </a>
            <a href="password.html" class="active">
                <span class="material-icons-sharp">password</span>
                <h3>Change Password</h3>
            </a>
            <a href="#" onclick="handleLogout()">
                <span class="material-icons-sharp">logout</span>
                <h3>Logout</h3>
            </a>
        </div>
        <div id="profile-btn" style="display: none;">
            <span class="material-icons-sharp">person</span>
        </div>
        <div class="theme-toggler">
            <span class="material-icons-sharp active">light_mode</span>
            <span class="material-icons-sharp">dark_mode</span>
        </div>
    </header>

    <div class="change-password-container">
        <form onsubmit="handlePasswordChange(event)">
            <h2>Change Password</h2>
            <p class="text-muted">Your new password must be different from previous used passwords.</p>
            
            <div id="message" class="message"></div>
            
            <div class="box">
                <p class="text-muted">Current Password</p>
                <input type="password" id="currentpass" required>
            </div>
            <div class="box">
                <p class="text-muted">New Password</p>
                <input type="password" id="newpass" required oninput="checkNewPasswordStrength(this.value)">
                <div class="password-strength">
                    <div class="bar" id="strengthBar"></div>
                </div>
            </div>
            <div class="box">
                <p class="text-muted">Confirm Password</p>
                <input type="password" id="confirmpass" required>
            </div>
            <div class="button">
                <input type="submit" value="Change Password" class="btn">
                <a href="index.html" class="text-muted">Cancel</a>
            </div>
            <a href="#"><p>Forget password?</p></a>
        </form>    
    </div>

    <script>
        // =============================================
        // CHECK IF USER IS LOGGED IN
        // =============================================
        if (!localStorage.getItem('currentUser')) {
            window.location.href = 'login.html';
        }

        // =============================================
        // APPLY SAVED THEME - FIX FOR DARK THEME
        // =============================================
        function applySavedTheme() {
            const isDarkMode = localStorage.getItem('dark-theme') === 'true';
            if (isDarkMode) {
                document.body.classList.add('dark-theme');
            } else {
                document.body.classList.remove('dark-theme');
            }
        }
        applySavedTheme();

        // =============================================
        // PASSWORD STRENGTH CHECK
        // =============================================
        function checkNewPasswordStrength(password) {
            const bar = document.getElementById('strengthBar');
            let strength = 0;
            if (password.length >= 8) strength += 25;
            if (password.match(/[a-z]/)) strength += 25;
            if (password.match(/[A-Z]/)) strength += 25;
            if (password.match(/[0-9]/)) strength += 25;
            
            bar.style.width = strength + '%';
            if (strength <= 25) {
                bar.style.background = '#dc2626';
            } else if (strength <= 50) {
                bar.style.background = '#f59e0b';
            } else if (strength <= 75) {
                bar.style.background = '#3b82f6';
            } else {
                bar.style.background = '#10b981';
            }
        }

        // =============================================
        // SHOW MESSAGE
        // =============================================
        function showMessage(text, type) {
            const message = document.getElementById('message');
            message.textContent = text;
            message.className = 'message ' + type;
            message.style.display = 'block';
            setTimeout(() => {
                message.style.display = 'none';
            }, 5000);
        }

        // =============================================
        // HANDLE PASSWORD CHANGE
        // =============================================
        function handlePasswordChange(e) {
            e.preventDefault();
            
            const currentPass = document.getElementById('currentpass').value;
            const newPass = document.getElementById('newpass').value;
            const confirmPass = document.getElementById('confirmpass').value;
            
            // Get current user
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (!currentUser) {
                showMessage('Please login first', 'error');
                setTimeout(() => window.location.href = 'login.html', 1500);
                return;
            }
            
            // Get all users
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            const userIndex = users.findIndex(u => u.email === currentUser.email);
            
            if (userIndex === -1) {
                showMessage('User not found', 'error');
                return;
            }
            
            // Check current password
            if (users[userIndex].password !== currentPass) {
                showMessage('Current password is incorrect', 'error');
                return;
            }
            
            // Validate new password
            if (newPass.length < 6) {
                showMessage('New password must be at least 6 characters', 'error');
                return;
            }
            
            if (newPass !== confirmPass) {
                showMessage('New passwords do not match', 'error');
                return;
            }
            
            if (newPass === currentPass) {
                showMessage('New password must be different from current password', 'error');
                return;
            }
            
            // Update password in users array
            users[userIndex].password = newPass;
            localStorage.setItem('users', JSON.stringify(users));
            
            // Update current user
            currentUser.password = newPass;
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            
            showMessage('Password changed successfully!', 'success');
            
            // Clear form
            document.getElementById('currentpass').value = '';
            document.getElementById('newpass').value = '';
            document.getElementById('confirmpass').value = '';
            document.getElementById('strengthBar').style.width = '0%';
        }

        // =============================================
        // LOGOUT FUNCTION
        // =============================================
        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('currentUser');
                window.location.href = 'login.html';
            }
        }
    </script>

</body>
</html>
